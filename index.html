<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siga nossas redes sociais para mais informações</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts: Space Grotesk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        h1, h2, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Fundo com imagem background.jpg do repositório + gradiente cyber */
        .cyber-bg {
            background-image: 
                linear-gradient(180deg, rgba(5, 7, 15, 0.75) 0%, rgba(10, 15, 30, 0.88) 100%),
                url('img/logo.png');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .bg-fallback {
            background-color: #070913;
        }

        /* Esferas de iluminação ambiente animadas */
        .glow-orb-1 {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(59, 130, 246, 0.15) 50%, rgba(0, 0, 0, 0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
            position: fixed;
            bottom: 10%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, rgba(139, 92, 246, 0.1) 60%, rgba(0, 0, 0, 0) 70%);
            filter: blur(70px);
            z-index: 0;
            pointer-events: none;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        @keyframes floatGlow {
            0% { transform: translateY(0px) scale(0.95); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Aura neon da logo */
        .logo-glow-container {
            position: relative;
        }

        .logo-glow-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6, #3b82f6, #06b6d4);
            background-size: 300% 300%;
            animation: borderRotate 4s linear infinite, logoPulse 3s ease-in-out infinite alternate;
            filter: blur(8px);
            opacity: 0.85;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes logoPulse {
            0% { filter: blur(6px); opacity: 0.7; }
            100% { filter: blur(12px); opacity: 1; }
        }

        /* Card Glassmorphism principal */
        .cyber-glass-panel {
            background: rgba(13, 18, 36, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        /* Botões em vidro translúcido */
        .glass-cyber-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Efeito Shimmer nos botões */
        .glass-cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.18),
                transparent
            );
            transition: left 0.7s ease;
            transform: skewX(-20deg);
        }

        .glass-cyber-btn:hover::before {
            left: 160%;
        }

        .glass-cyber-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(168, 85, 247, 0.5);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.25), 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .glass-cyber-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Destaques de cores ao interagir com os botões */
        .btn-insta:hover .icon-box { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
        .btn-tiktok:hover .icon-box { background: #000000; color: #00f2fe; box-shadow: -2px 2px 0 #fe2c55; }
        .btn-yt:hover .icon-box { background: #ff0000; color: white; }
        .btn-discord:hover .icon-box { background: #5865f2; color: white; }
        .btn-site:hover .icon-box { background: linear-gradient(135deg, #2563eb, #06b6d4); color: white; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
