<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu TL | TL STUDIO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #05070d;
      background-image: 
        radial-gradient(at 50% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.15) 0px, transparent 50%);
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }
    .neon-border:hover {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Container Principal -->
  <div class="w-full max-w-md flex flex-col items-center">
    
    <!-- Coroa & Avatar / Logo Central -->
    <div class="relative mb-4 flex flex-col items-center">
      <!-- Coroa Neon -->
      <i class="fa-solid font-black fa-crown text-3xl text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)] -mb-3 z-10"></i>
      
      <!-- Logo Central -->
      <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-blue-600 via-cyan-400 to-indigo-600 p-[2px] neon-border transition-all duration-300">
        <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center border border-slate-800">
          <span class="text-3xl font-black tracking-tighter bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">
            TL
          </span>
        </div>
      </div>
    </div>

    <!-- Título & Subtítulo -->
    <h1 class="text-2xl font-bold tracking-wide drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]">Menu TL</h1>
    <p class="text-xs text-slate-400 mt-1 mb-3">TL STUDIO • Soluções Web & Design</p>

    <!-- Badges / Tags -->
    <div class="flex gap-2 mb-6">
      <span class="px-3 py-1 text-[11px] font-semibold bg-blue-950/60 border border-blue-500/30 text-blue-300 rounded-full flex items-center gap-1.5 backdrop-blur-md">
        <i class="fa-solid fa-code text-[10px]"></i> Developer
      </span>
      <span class="px-3 py-1 text-[11px] font-semibold bg-purple-950/60 border border-purple-500/30 text-purple-300 rounded-full flex items-center gap-1.5 backdrop-blur-md">
        <i class="fa-solid fa-gamepad text-[10px]"></i> Gamer
      </span>
    </div>

    <!-- Lista de Links -->
    <div class="w-full space-y-3">
      
      <!-- Link 1 -->
      <a href="#" target="_blank" class="w-full p-3.5 rounded-xl bg-slate-900/60 border border-slate-800/80 hover:border-blue-500/50 backdrop-blur-md flex items-center justify-between transition-all duration-300 hover:scale-[1.02] group neon-border">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 group-hover:bg-blue-500 group-hover:text-white transition-all">
            <i class="fa-brands fa-whatsapp text-lg"></i>
          </div>
          <span class="text-sm font-medium text-slate-200 group-hover:text-white">Fazer Orçamento (WhatsApp)</span>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-blue-400 transition-all"></i>
      </a>

      <!-- Link 2 -->
      <a href="#" target="_blank" class="w-full p-3.5 rounded-xl bg-slate-900/60 border border-slate-800/80 hover:border-blue-500/50 backdrop-blur-md flex items-center justify-between transition-all duration-300 hover:scale-[1.02] group neon-border">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-all">
            <i class="fa-brands fa-discord text-lg"></i>
          </div>
          <span class="text-sm font-medium text-slate-200 group-hover:text-white">Comunidade Discord</span>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-indigo-400 transition-all"></i>
      </a>

      <!-- Link 3 -->
      <a href="#" target="_blank" class="w-full p-3.5 rounded-xl bg-slate-900/60 border border-slate-800/80 hover:border-blue-500/50 backdrop-blur-md flex items-center justify-between transition-all duration-300 hover:scale-[1.02] group neon-border">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-400 group-hover:bg-pink-500 group-hover:text-white transition-all">
            <i class="fa-brands fa-instagram text-lg"></i>
          </div>
          <span class="text-sm font-medium text-slate-200 group-hover:text-white">Instagram Oficial</span>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-pink-400 transition-all"></i>
      </a>

    </div>

    <!-- Rodapé -->
    <footer class="mt-8 text-center text-xs text-slate-600">
      © TL STUDIO • Todos os direitos reservados
    </footer>

  </div>

</body>
</html>
